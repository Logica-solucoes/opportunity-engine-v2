[project]
name = "opportunity-engine-v2"
version = "0.1.0"
description = "Marketing GEM platform: API, worker and web"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "pillow",
    "python-multipart>=0.0.32",
    "google-genai>=2.33.0",
    "google-cloud-bigquery>=3.47.0",
    "numpy==2.5.0",
    "pandas==3.0.3",
    "scipy==1.18.0",
    "statsmodels==0.14.6",
    "scikit-learn==1.9.0",
    "holidays==0.99",
    "matplotlib==3.11.0",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# plans/specs in docs/ embed code blocks as written at the time; formatting them rewrites history
extend-exclude = ["docs"]

[tool.ruff.lint]
# Depends()/Cookie() in defaults is how FastAPI declares dependencies
extend-ignore = ["B008"]
