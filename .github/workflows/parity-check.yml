name: parity-check

on:
  push:
    branches: [fix/parity-ci]

jobs:
  parity:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: Haswell
      NPY_DISABLE_CPU_FEATURES: "AVX512F AVX512CD AVX512_SKX AVX512_CLX AVX512_CNL AVX512_ICL AVX512_SPR"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: lscpu | grep -E "Model name|Flags" | cut -c1-400
      - run: uv run python -c "import numpy as np; from threadpoolctl import threadpool_info as t; print([(i['filepath'].split('/')[-1], i.get('architecture')) for i in t()]); print([k for k, v in np._core._multiarray_umath.__cpu_features__.items() if v and 'AVX' in k])"
      - run: uv run pytest tests/engine/test_parity.py -q -W ignore
