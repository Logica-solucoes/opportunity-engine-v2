name: parity-check

on:
  push:
    branches: [fix/parity-ci]

jobs:
  parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: Haswell
      NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: lscpu | grep -E "Model name|Flags" | cut -c1-2000
      - run: |
          OPENBLAS_VERBOSE=2 uv run python - <<'PY'
          import numpy as np, scipy.linalg, sklearn.linear_model
          from threadpoolctl import threadpool_info as t
          print(t())
          print("numpy cpu features true:", sorted(k for k, v in np._core._multiarray_umath.__cpu_features__.items() if v))
          np.show_runtime()
          PY
      - run: uv run pytest tests/engine/test_parity.py -q -W ignore
