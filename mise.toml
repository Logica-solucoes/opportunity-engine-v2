[tools]
python = "3.13"
uv = "latest"
node = "22"

[env]
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed"] }
# optional: no .env means the defaults in .env.example
_.file = ".env"

[tasks.test]
description = "Run tests"
run = "uv run pytest"

[tasks.api]
description = "FastAPI with hot reload on :8000"
run = "uv run uvicorn api.main:app --reload --port 8000"

[tasks.web]
description = "Vite dev server (proxies /api to :8000)"
dir = "web"
run = "bun run dev"

[tasks.worker]
description = "Run one queued run: mise run worker <run_id>"
run = "uv run python -m api.worker"

[tasks.db-migrate]
description = "Apply Alembic migrations"
run = "uv run alembic -c api/alembic.ini upgrade head"

[tasks.create-admin]
description = "Create or promote a platform admin: mise run create-admin <email> <name>"
run = "uv run python -m api.cli create-admin"

[tasks.parity]
description = "Engine parity against the frozen prototype's snapshot (~95 s)"
env = { OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1", OPENBLAS_CORETYPE = "Haswell", NPY_DISABLE_CPU_FEATURES = "X86_V4 AVX512_ICL AVX512_SPR" }
run = "uv run pytest tests/engine/test_parity.py -q"

[tasks.parity-real]
description = "Real-data parity (Gol): runs the frozen prototype on exemplo_csv/, then the engine test (~4 min). LEGACY_REPO defaults to ../opportunity-engine"
env = { OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1", OPENBLAS_CORETYPE = "Haswell", NPY_DISABLE_CPU_FEATURES = "X86_V4 AVX512_ICL AVX512_SPR" }
run = """
set -e
LEGACY="${LEGACY_REPO:-$(realpath ../opportunity-engine)}"
HERE="$PWD"
SPEC="$(mktemp --suffix=.json)"
uv run python -m tests.fixtures.parity.make_real_spec "$SPEC"
(cd "$LEGACY" && env -u VIRTUAL_ENV uv run python "$HERE/tests/fixtures/parity/generate_legacy_snapshot.py" --legacy-repo . --dataset-json "$SPEC" --out "$HERE/tests/fixtures/parity/real/gol.json")
rm -f "$SPEC"
uv run pytest tests/engine/test_parity_real.py -q
"""

[tasks.parity-a4-golden]
description = "Pin the engine's own causal numbers on the Gol (real/gol_a4_events.json) and print how far each event moved from the prototype. Only with approval; needs exemplo_csv/ and real/gol.json"
env = { OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1", OPENBLAS_CORETYPE = "Haswell", NPY_DISABLE_CPU_FEATURES = "X86_V4 AVX512_ICL AVX512_SPR" }
run = "uv run python -m tests.fixtures.parity.make_a4_golden"

[tasks.e2e]
description = "Playwright E2E against the built SPA (needs docker compose up)"
dir = "web"
run = "bun run e2e"
